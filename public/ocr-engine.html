<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com blob:; worker-src blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; connect-src https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://tessdata.projectnaptha.com blob:; img-src blob: data:; style-src 'unsafe-inline';">
<title>OCR kuitansi terisolasi</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
</head>
<body>
<script>
"use strict";
(function(){
  const send=(message)=>parent.postMessage(message,"*");
  const MAX_PAGES=5;
  const MAX_BYTES=12*1024*1024;
  let busy=false;
  const progress=(nonce,stage,value)=>send({source:"sipbp-ocr",nonce,type:"progress",stage,value});
  const describeError=(error,phase)=>{
    const raw=error instanceof Error?error.message:String(error||"Kesalahan tidak dikenal");
    if(/failed to fetch|networkerror|network request failed|load failed/i.test(raw))
      return "Gagal mengunduh komponen OCR saat "+phase+". Periksa koneksi ke cdn.jsdelivr.net / cdnjs.cloudflare.com, nonaktifkan pemblokir jaringan bila diperlukan, kemudian coba lagi. (Detail: "+raw+")";
    return "Gagal saat "+phase+": "+raw;
  };
  function joinText(items){
    const byRow=new Map();
    for(const item of items){
      const str=String(item.str||"").trim();
      if(!str)continue;
      const xy=item.transform||[0,0,0,0,0,0];
      const y=Math.round(xy[5]/3)*3;
      if(!byRow.has(y))byRow.set(y,[]);
      byRow.get(y).push({x:xy[4],str});
    }
    const allCells=[...byRow.values()].flat();
    if(!allCells.length)return "";
    const minX=Math.min(...allCells.map(c=>c.x));
    return [...byRow.entries()].sort((a,b)=>b[0]-a[0])
      .map(([,cells])=>{
        let line="",end=0;
        for(const cell of cells.sort((a,b)=>a.x-b.x)){
          const column=Math.max(0,Math.round((cell.x-minX)/5));
          const gap=Math.max(1,Math.min(120,column-end));
          line+=" ".repeat(gap)+cell.str;
          end=Math.max(end,column+cell.str.length);
        }
        return line.trimEnd();
      }).join("\n");
  }
  async function processFile(job){
    const {nonce,name,mime,buffer}=job;
    if(!(buffer instanceof ArrayBuffer)||buffer.byteLength>MAX_BYTES||buffer.byteLength===0)throw Error("Berkas tidak valid atau melebihi 12 MB.");
    const pdf= mime==="application/pdf" || /\.pdf$/i.test(name);
    if(!pdf&&!/^image\/(png|jpeg|webp)$/.test(mime))throw Error("Gunakan PDF, PNG, JPEG atau WEBP.");
    if(!self.Tesseract)throw Error("Pustaka Tesseract tidak dapat dimuat; periksa akses CDN.");
    if(pdf&&!self.pdfjsLib)throw Error("Pustaka PDF tidak dapat dimuat; periksa akses CDN.");
    let ocrWorker,phase="menyiapkan dokumen";
    const getWorker=async()=>{
      if(ocrWorker)return ocrWorker;
      const common={
        workerPath:"https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js",
        corePath:"https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1",
        logger:x=>{if(x.status)progress(nonce,x.status,Math.round((x.progress||0)*100));}
      };
      let firstError;
      for(const candidate of [
        {lang:"ind",langPath:"https://cdn.jsdelivr.net/npm/@tesseract.js-data/ind@1.0.0/4.0.0_best_int"},
        {lang:"eng",langPath:"https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int"}
      ]){
        try{
          phase="mengunduh OCR bahasa "+candidate.lang;
          progress(nonce,phase,0);
          ocrWorker=await Tesseract.createWorker(candidate.lang,1,{...common,langPath:candidate.langPath});
          return ocrWorker;
        }catch(error){
          if(!firstError)firstError=error;
          progress(nonce,"OCR "+candidate.lang+" tidak tersedia, mencoba alternatif",0);
        }
      }
      throw Error("Semua sumber bahasa OCR gagal. "+describeError(firstError,phase));
    };
    try {
      if(!pdf){
        progress(nonce,"Membaca gambar",0);
        const blob=new Blob([buffer],{type:mime});
        // Blob langsung agar tidak gagal fetch URL blob dari worker dalam iframe sandbox.
        phase="memproses screenshot/gambar";
        const worker=await getWorker();
        phase="membaca teks gambar";
        const result=await worker.recognize(blob);
        return {text:result.data.text||"",pages:1,mode:"ocr"};
      }
      pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      progress(nonce,"Membuka PDF",0);
      const doc=await pdfjsLib.getDocument({data:new Uint8Array(buffer),isEvalSupported:false,useSystemFonts:true}).promise;
      const pages=Math.min(doc.numPages,MAX_PAGES);
      const results=[];
      let usedOcr=false;
      for(let i=1;i<=pages;i++){
        const page=await doc.getPage(i);
        const extracted=joinText((await page.getTextContent()).items);
        if(extracted.replace(/\s+/g,"").length>=65){
          results.push(extracted);
        } else {
          usedOcr=true;
          progress(nonce,"OCR PDF halaman "+i+"/"+pages,Math.round(i/pages*100));
          const viewport=page.getViewport({scale:1.8});
          if(viewport.width*viewport.height>18000000)throw Error("Halaman terlalu besar untuk OCR lokal.");
          const canvas=document.createElement("canvas");
          canvas.width=Math.round(viewport.width);canvas.height=Math.round(viewport.height);
          const ctx=canvas.getContext("2d",{willReadFrequently:true});
          if(!ctx)throw Error("Canvas browser tidak tersedia.");
          await page.render({canvasContext:ctx,viewport}).promise;
          try{
            phase="mengenali teks PDF halaman "+i;
            const result=await (await getWorker()).recognize(canvas);
            results.push(result.data.text||"");
          }finally{canvas.width=0;canvas.height=0;}
        }
        progress(nonce,"Memproses halaman "+i+"/"+pages,Math.round(i/pages*100));
      }
      return {text:results.join("\n--- HALAMAN ---\n"),pages,mode:usedOcr?"pdf+ocr":"pdf-text",truncated:doc.numPages>pages};
    } catch(error){throw Error(describeError(error,phase));}
    finally {
      if(ocrWorker)await ocrWorker.terminate().catch(()=>{});
    }
  }
  window.addEventListener("message",async event=>{
    // In a unique-origin sandbox. Only the embedding window may submit files.
    if(event.source!==parent||busy)return;
    const data=event.data;
    if(!data||data.type!=="sipbp-ocr-file"||typeof data.nonce!=="string"||data.nonce.length>96)return;
    busy=true;
    try{
      const result=await processFile(data);
      send({source:"sipbp-ocr",type:"result",nonce:data.nonce,...result});
    }catch(error){
      send({source:"sipbp-ocr",type:"error",nonce:data.nonce,message:error instanceof Error?error.message:"OCR tidak berhasil"});
    }finally{busy=false;}
  });
  send({source:"sipbp-ocr",type:"ready"});
})();
</script>
</body>
</html>
